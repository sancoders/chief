<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Caseras</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf6f0;
        color: #292524;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      svg {
        width: 96px;
        height: 96px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }
      p {
        color: #78716c;
        margin: 0 0 24px;
        max-width: 32ch;
      }
      button {
        background: #059669;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 14px 28px;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Ícono inline: esta página debe funcionar sin ningún request extra. -->
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Caseras">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#059669" />
            <stop offset="1" stop-color="#047857" />
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="22" fill="url(#bg)" />
        <g transform="translate(50 52) scale(0.84) translate(-50 -50)">
          <path fill="#ffffff" d="M50 12 L92 48 L82 48 L82 86 L18 86 L18 48 L8 48 Z" />
          <path fill="url(#bg)" d="M50 74 C41 66 35 61 35 54 C35 48.7 39.2 45 43.8 45 C46.4 45 48.8 46.3 50 48.4 C51.2 46.3 53.6 45 56.2 45 C60.8 45 65 48.7 65 54 C65 61 59 66 50 74 Z" />
        </g>
      </svg>
      <h1>Sin conexión</h1>
      <p>No pudimos cargar la página. Revisá tu conexión e intentá de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
